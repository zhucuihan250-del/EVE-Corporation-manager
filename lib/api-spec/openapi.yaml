      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourierRouteBody"
      responses:
        "201":
          description: Courier route created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierRoute"

  /courier/admin/routes/{id}:
    patch:
      operationId: updateCourierRoute
      tags: [courier]
      summary: Update a courier route and pricing rule
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourierRouteBody"
      responses:
        "200":
          description: Courier route updated
          content:
            application/json:
