                $ref: "#/components/schemas/CourierRoute"

  /economy:
    get:
      operationId: getEconomySummary
      tags: [economy]
      responses:
        "200":
          description: Director-only corporation economy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomySummary"

  /economy/connect:
    get:
      operationId: connectCorporationWallet
      tags: [economy]
      responses:
        "302":
          description: Redirect to EVE SSO wallet authorization

  /economy/sync:
    post:
      operationId: syncCorporationWallet
      tags: [economy]
      responses:
        "200":
          description: Wallet sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: integer }
                required: [entries]

  /economy/analyze:
    post:
      operationId: analyzeCorporationEconomy
      tags: [economy]
      responses:
        "200":
          description: Evidence-based AI economy analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyAnalysis"

  /structures:
    get:
      operationId: getCorporationStructures
      tags: [structures]
      summary: Browse the active corporation's structures and fuel expiry
      responses:
        "200":
          description: Corporation-isolated structure dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporationStructuresDashboard"

  /structures/connect:
    get:
      operationId: connectCorporationStructures
      tags: [structures]
      summary: Start independent EVE SSO authorization for corporation structures
      responses:
        "302":
          description: Redirect to EVE SSO structure authorization

  /structures/sync:
    post:
      operationId: syncCorporationStructures
      tags: [structures]
      summary: Refresh the active corporation's structures from EVE ESI
      responses:
        "200":
          description: Synchronized corporation structure dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporationStructuresDashboard"

  /pap-market/overview:
    get:
      operationId: getPapMarketOverview
      tags: [pap-market]
      summary: Get the active corporation's market, wallet, and current user's history
      responses:
        "200":
          description: PAP Market overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PapMarketOverview"

  /pap-market/orders:
    post:
      operationId: createPapMarketOrder
      tags: [pap-market]
      summary: Create a BUY or SELL order without accepting a client-supplied price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePapMarketOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PapMarketOrder"

  /pap-market/orders/{id}/take:
    post:
      operationId: takePapMarketOrder
      tags: [pap-market]
      summary: Accept all or part of an order and create a pending admin transaction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakePapMarketOrderBody"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PapMarketTransaction"

  /pap-market/orders/{id}/cancel:
    post:
      operationId: cancelPapMarketOrder
      tags: [pap-market]
      summary: Cancel the uncommitted remainder of the current user's order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PapMarketOrder"

  /pap-market/admin/overview:
    get:
      operationId: getPapMarketAdminOverview
      tags: [pap-market]
      summary: Get corporation-scoped market transactions, orders, and immutable admin logs
      responses:
        "200":
          description: PAP Market administration overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PapMarketAdminOverview"

  /pap-market/admin/transactions/{id}:
    patch:
      operationId: reviewPapMarketTransaction
      tags: [pap-market]
      summary: Approve, reject, or dispute a pending PAP transaction
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewPapMarketTransactionBody"
      responses:
        "200":
          description: Reviewed transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PapMarketTransaction"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    PapMarketWallet:
      type: object
      properties:
        totalPap: { type: number }
        availablePap: { type: number }
        lockedPap: { type: number }
      required: [totalPap, availablePap, lockedPap]

    PapMarketOrder:
      type: object
      properties:
        id: { type: integer }
        corporationId: { type: integer }
        ownerId: { type: integer }
        ownerName: { type: string }
        type: { type: string, enum: [buy, sell] }
        originalAmount: { type: number }
        remainingAmount: { type: number }
        matchedAmount: { type: number }
        lockedPapAmount: { type: number }
        status: { type: string, enum: [open, partially_filled, filled, cancelled, expired] }
        totalIskValue: { type: number }
        remainingIskValue: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
      required: [id, corporationId, ownerId, ownerName, type, originalAmount, remainingAmount, matchedAmount, lockedPapAmount, status, totalIskValue, remainingIskValue, createdAt, updatedAt, cancelledAt, expiresAt]

    PapMarketTransaction:
      type: object
      properties:
        id: { type: integer }
        corporationId: { type: integer }
        orderId: { type: integer }
        orderType: { type: string, enum: [buy, sell] }
        buyerId: { type: integer }
        buyerName: { type: string }
        sellerId: { type: integer }
        sellerName: { type: string }
        papAmount: { type: number }
        iskValue: { type: number }
        status: { type: string, enum: [pending_admin, completed, rejected, disputed, cancelled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
        reviewedBy: { type: [integer, "null"] }
        adminNote: { type: [string, "null"] }
      required: [id, corporationId, orderId, orderType, buyerId, buyerName, sellerId, sellerName, papAmount, iskValue, status, createdAt, updatedAt, reviewedAt, reviewedBy, adminNote]

    PapMarketAdminLog:
      type: object
      properties:
        id: { type: integer }
        corporationId: { type: integer }
        adminId: { type: integer }
        action: { type: string, enum: [approve, reject, dispute] }
        transactionId: { type: integer }
        orderId: { type: integer }
        beforeState: { type: object, additionalProperties: true }
        afterState: { type: object, additionalProperties: true }
        note: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, corporationId, adminId, action, transactionId, orderId, beforeState, afterState, note, createdAt]

    PapLedgerEntry:
      type: object
      properties:
        id: { type: integer }
        corporationId: { type: integer }
        userId: { type: [integer, "null"] }
        userName: { type: string }
        amount: { type: number }
        lockedDelta: { type: number }
        type: { type: string, enum: [opening_balance, pap_earned, redemption, admin_adjustment, activity_deduction, account_merge, market_order_lock, market_order_unlock, market_transaction_lock, market_transaction_unlock, market_buy, market_sell, reversal] }
        orderId: { type: [integer, "null"] }
        transactionId: { type: [integer, "null"] }
        balanceAfter: { type: number }
        lockedAfter: { type: number }
        availableAfter: { type: number }
        adminId: { type: [integer, "null"] }
        reason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, corporationId, userId, userName, amount, lockedDelta, type, orderId, transactionId, balanceAfter, lockedAfter, availableAfter, adminId, reason, createdAt]

    PapMarketOverview:
      type: object
      properties:
        wallet: { $ref: "#/components/schemas/PapMarketWallet" }
        sellOrders:
          type: array
          items: { $ref: "#/components/schemas/PapMarketOrder" }
        buyOrders:
          type: array
          items: { $ref: "#/components/schemas/PapMarketOrder" }
        myOrders:
          type: array
          items: { $ref: "#/components/schemas/PapMarketOrder" }
        myTransactions:
          type: array
          items: { $ref: "#/components/schemas/PapMarketTransaction" }
        history:
          type: array
          items: { $ref: "#/components/schemas/PapMarketTransaction" }
        ledger:
          type: array
          items: { $ref: "#/components/schemas/PapLedgerEntry" }
      required: [wallet, sellOrders, buyOrders, myOrders, myTransactions, history, ledger]

    PapMarketAdminOverview:
      type: object
      properties:
        transactions:
          type: array
          items: { $ref: "#/components/schemas/PapMarketTransaction" }
        orders:
          type: array
          items: { $ref: "#/components/schemas/PapMarketOrder" }
        adminLogs:
          type: array
          items: { $ref: "#/components/schemas/PapMarketAdminLog" }
        ledger:
          type: array
          items: { $ref: "#/components/schemas/PapLedgerEntry" }
      required: [transactions, orders, adminLogs, ledger]

    CreatePapMarketOrderBody:
      type: object
      properties:
        type: { type: string, enum: [buy, sell] }
        amount: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        requestId: { type: string, minLength: 8, maxLength: 100 }
      required: [type, amount, requestId]

    TakePapMarketOrderBody:
      type: object
      properties:
        amount: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        requestId: { type: string, minLength: 8, maxLength: 100 }
      required: [amount, requestId]

    ReviewPapMarketTransactionBody:
      type: object
      properties:
        action: { type: string, enum: [approve, reject, dispute] }
        note: { type: string, maxLength: 2000 }
      required: [action]

    CurrentUser:
      type: object
      properties:
        id:
          type: integer
        eveCharacterId:
          type: ["integer", "null"]
        eveCharacterName:
          type: ["string", "null"]
        corporationId:
          type: ["integer", "null"]
        corporationName:
          type: ["string", "null"]
        isPrimaryCorporation:
          type: boolean
        role:
          type: string
          enum: [member, fc, admin, controller]
        permissions:
          type: array
          items: { type: string }
        modules:
          $ref: "#/components/schemas/CorporationModules"
        reimbursementOpen:
          type: boolean
        tacticalGroups:
          type: array
          items:
            $ref: "#/components/schemas/TacticalGroupSummary"
        pap:
          type: number
          description: Current PAP available for use after market locks.
        totalPap:
          type: number
          deprecated: true
          description: Compatibility alias of pap.
        redeemablePap:
          type: number
          deprecated: true
          description: Compatibility total PAP balance before market locks.
        availablePap:
          type: number
        lockedPap:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - isPrimaryCorporation
        - permissions
        - modules
        - reimbursementOpen
        - tacticalGroups
        - pap
        - totalPap
        - redeemablePap
        - availablePap
        - lockedPap
        - createdAt

    User:
      type: object
      properties:
        id:
          type: integer
        eveCharacterId:
          type: ["integer", "null"]
        eveCharacterName:
          type: ["string", "null"]
        corporationId:
          type: ["integer", "null"]
        corporationName:
          type: ["string", "null"]
        role:
          type: string
          enum: [member, fc, admin, controller]
        pap:
          type: number
          description: Current PAP available for use after market locks.
        totalPap:
          type: number
          deprecated: true
          description: Compatibility alias of pap.
        redeemablePap:
          type: number
          deprecated: true
          description: Compatibility total PAP balance before market locks.
        availablePap:
          type: number
        lockedPap:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - pap
        - totalPap
        - redeemablePap
        - availablePap
        - lockedPap
        - createdAt

    UpdateUserRoleBody:
      type: object
      properties:
        role:
          type: string
          enum: [member, fc, admin, controller]
      required:
        - role

    AdjustPapBody:
      type: object
      properties:
        amount:
          type: number
        reason:
          type: string
      required:
        - amount
        - reason

    Character:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        eveCharacterId:
          type: integer
        eveCharacterName:
          type: string
        corporationId:
          type: ["integer", "null"]
        corporationName:
          type: ["string", "null"]
        isMain:
          type: boolean
        deletedAt:
          type: ["string", "null"]
          format: date-time
        retainedUntil:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - eveCharacterId
        - eveCharacterName
        - isMain
        - createdAt

    DeleteCharacterResponse:
      type: object
      properties:
        success:
          type: boolean
        removedMain:
          type: boolean
        newMainCharacterId:
          type: ["integer", "null"]
        newMainCharacterName:
          type: ["string", "null"]
        requiresReauthentication:
          type: boolean
      required:
        - success
        - removedMain
        - newMainCharacterId
        - newMainCharacterName
        - requiresReauthentication

    FittingCategory:
      type: string
      enum: [ship, module, charge, drone]

    FittingSlot:
      type: string
      enum: [high, medium, low, rig, subsystem, charge, drone, other]

    FittingCatalogItem:
      type: object
      properties:
        typeId:
          type: integer
        category:
          $ref: "#/components/schemas/FittingCategory"
        groupId:
          type: integer
        slot:
          $ref: "#/components/schemas/FittingSlot"
        hardpoint:
          type: ["string", "null"]
          enum: [turret, launcher, null]
        name:
          type: string
        nameEn:
          type: string
        nameZh:
          type: string
        groupName:
          type: string
        categoryName:
          type: string
      required:
        - typeId
        - category
        - groupId
        - slot
        - hardpoint
        - name
        - nameEn
        - nameZh
        - groupName
        - categoryName

    FittingCatalogResponse:
      type: object
      properties:
        sdeBuildNumber:
          type: ["integer", "null"]
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/FittingCatalogItem"
      required:
        - sdeBuildNumber
        - generatedAt
        - items

    FittingSimulationModuleInput:
      type: object
      properties:
        typeId:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required:
        - typeId

    FittingSimulationBody:
      type: object
      properties:
        shipId:
          type: integer
        modules:
          type: array
          items:
            $ref: "#/components/schemas/FittingSimulationModuleInput"
        mode:
          type: string
          enum: [pvp, pve]
        language:
          type: string
          enum: [en, zh]
      required:
        - shipId
        - modules
        - mode
        - language

    FittingSlotMetric:
      type: object
      properties:
        used:
          type: integer
        limit:
          type: number
        overloaded:
          type: boolean
      required:
        - used
        - limit
        - overloaded

    FittingResourceMetric:
      type: object
      properties:
        used:
          type: number
        limit:
          type: number
        percent:
          type: number
        overloaded:
          type: boolean
      required:
        - used
        - limit
        - percent
        - overloaded

    FittingSimulatedModule:
      allOf:
        - $ref: "#/components/schemas/FittingCatalogItem"
        - type: object
          properties:
            quantity:
              type: integer
            cpu:
              type: number
            powergrid:
              type: number
          required:
            - quantity
            - cpu
            - powergrid

    FittingSimulationResult:
      type: object
      properties:
        precision:
          type: string
          enum: [approximate]
        sdeBuildNumber:
          type: ["integer", "null"]
        ship:
          $ref: "#/components/schemas/FittingCatalogItem"
        modules:
          type: array
          items:
            $ref: "#/components/schemas/FittingSimulatedModule"
        slots:
          type: object
          properties:
            high:
              $ref: "#/components/schemas/FittingSlotMetric"
            medium:
              $ref: "#/components/schemas/FittingSlotMetric"
            low:
              $ref: "#/components/schemas/FittingSlotMetric"
            rig:
              $ref: "#/components/schemas/FittingSlotMetric"
            subsystem:
              $ref: "#/components/schemas/FittingSlotMetric"
          required:
            - high
            - medium
            - low
            - rig
            - subsystem
        resources:
          type: object
          properties:
            cpu:
              $ref: "#/components/schemas/FittingResourceMetric"
            powergrid:
              $ref: "#/components/schemas/FittingResourceMetric"
            calibration:
              $ref: "#/components/schemas/FittingResourceMetric"
          required:
            - cpu
            - powergrid
            - calibration
        hardpoints:
          type: object
          properties:
            turret:
              $ref: "#/components/schemas/FittingSlotMetric"
            launcher:
              $ref: "#/components/schemas/FittingSlotMetric"
          required:
            - turret
            - launcher
        defense:
          type: object
          properties:
            shieldHp:
              type: number
            armorHp:
              type: number
            hullHp:
              type: number
            estimatedEhp:
              type: number
          required:
            - shieldHp
            - armorHp
            - hullHp
            - estimatedEhp
        mobility:
          type: object
          properties:
            maxVelocity:
              type: number
            mass:
              type: number
            signatureRadius:
              type: number
          required:
            - maxVelocity
            - mass
            - signatureRadius
        capacitor:
          type: object
          properties:
            capacity:
              type: number
            rechargeTime:
              type: ["number", "null"]
            activeCapUsePerSecond:
              type: number
          required:
            - capacity
            - rechargeTime
            - activeCapUsePerSecond
        offense:
          type: object
          properties:
            weaponCount:
              type: integer
            estimatedDps:
              type: ["number", "null"]
          required:
            - weaponCount
            - estimatedDps
        recommendations:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
      required:
        - precision
        - sdeBuildNumber
        - ship
        - modules
        - slots
        - resources
        - hardpoints
        - defense
        - mobility
        - capacitor
        - offense
        - recommendations
        - limitations

    Fleet:
      type: object
      properties:
        id:
          type: integer
        corporationId:
          type: integer
        eveFleetId:
          type: ["string", "null"]
        name:
          type: string
        fleetCommander:
          type: string
        papValue:
          type: number
        isActive:
          type: boolean
        fleetFunction:
          type: string
        identityGroupId:
          type: ["integer", "null"]
        identityGroupName:
          type: ["string", "null"]
        reimbursementEnabled:
          type: boolean
        reimbursementRule:
          oneOf:
            - $ref: "#/components/schemas/FleetReimbursementRule"
            - type: "null"
        startedAt:
          type: ["string", "null"]
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        participantCount:
          type: ["integer", "null"]
        battleReportId:
          type: ["integer", "null"]
      required:
        - id
        - corporationId
        - name
        - fleetCommander
        - papValue
        - isActive
        - fleetFunction
        - identityGroupId
        - identityGroupName
        - reimbursementEnabled
        - createdAt

    CreateFleetBody:
      type: object
      properties:
        eveFleetId:
          type: ["string", "null"]
        name:
          type: string
        fleetCommander:
          type: string
        papValue:
          type: number
        startedAt:
          type: ["string", "null"]
        fleetFunction:
          type: string
        identityGroupId:
          type: ["integer", "null"]
        reimbursementEnabled:
          type: boolean
        reimbursementRule:
          oneOf:
            - $ref: "#/components/schemas/FleetReimbursementRule"
            - type: "null"
      required:
        - name
        - fleetCommander
        - papValue

    BattleReportSummary:
      type: object
      properties:
        id:
          type: integer
        fleetId:
          type: ["integer", "null"]
        fleetName:
          type: string
        fleetCommander:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, generating, ready, partial, failed]
        errorMessage:
          type: ["string", "null"]
        totalDestroyed:
          type: number
        totalLost:
          type: number
        damageDealt:
          type: number
        killmailCount:
          type: integer
        friendlyLosses:
          type: integer
        hostileLosses:
          type: integer
        primarySystemId:
          type: ["integer", "null"]
        primarySystemName:
          type: ["string", "null"]
        generatedAt:
          type: ["string", "null"]
          format: date-time
        lastSyncedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        participantCount:
          type: integer
