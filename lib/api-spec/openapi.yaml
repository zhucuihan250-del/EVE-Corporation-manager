        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourierAgentBody"
      responses:
        "200":
          description: Courier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierAgent"

  /courier/admin/routes:
    post:
      operationId: createCourierRoute
