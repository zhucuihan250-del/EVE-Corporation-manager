        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, corporationId, courierAgentId, courierName, origin, destination, pricingMethod, baseFee, pricePerM3, collateralRate, isActive, createdAt, updatedAt]

    CourierQuoteInput:
      type: object
      properties:
        routeId: { type: integer }
        volumeM3: { type: number, exclusiveMinimum: 0 }
        collateral: { type: number, minimum: 0 }
      required: [routeId, volumeM3, collateral]

    CourierQuote:
      type: object
      properties:
        routeId: { type: integer }
        courierName: { type: string }
        origin: { type: string }
        destination: { type: string }
        volumeM3: { type: number }
        collateral: { type: number }
        calculatedFee: { type: number }
        formula: { type: string }
      required: [routeId, courierName, origin, destination, volumeM3, collateral, calculatedFee, formula]

    CourierOrder:
      type: object
      properties:
        id: { type: integer }
        corporationId: { type: integer }
        routeId: { type: integer }
        courierAgentId: { type: integer }
        submittedBy: { type: ["integer", "null"] }
        submitterName: { type: string }
        courierName: { type: string }
        origin: { type: string }
        destination: { type: string }
        pricingMethod:
          $ref: "#/components/schemas/CourierPricingMethod"
        baseFee: { type: number }
        pricePerM3: { type: number }
        collateralRate: { type: number }
        volumeM3: { type: number }
        collateral: { type: number }
        calculatedFee: { type: number }
        note: { type: ["string", "null"] }
        internalNotes: { type: ["string", "null"] }
        canManageStatus: { type: boolean }
        status:
          type: string
          enum: [submitted, accepted, in_transit, completed, rejected, cancelled]
        acceptedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, corporationId, routeId, courierAgentId, submittedBy, submitterName, courierName, origin, destination, pricingMethod, baseFee, pricePerM3, collateralRate, volumeM3, collateral, calculatedFee, note, internalNotes, canManageStatus, status, acceptedAt, completedAt, createdAt, updatedAt]

    CreateCourierOrderBody:
      type: object
      properties:
        routeId: { type: integer }
        volumeM3: { type: number, exclusiveMinimum: 0 }
        collateral: { type: number, minimum: 0 }
        quotedFee:
          type: number
          minimum: 0
          description: Fee returned by the latest authoritative quote
        note: { type: string, maxLength: 5000 }
      required: [routeId, volumeM3, collateral, quotedFee]

    UpdateCourierOrderBody:
      type: object
      properties:
        status:
          type: string
          enum: [submitted, accepted, in_transit, completed, rejected, cancelled]
        internalNotes: { type: string, maxLength: 5000 }
      required: [status]

    CourierCandidate:
      type: object
      properties:
        userId: { type: integer }
        name: { type: string }
        isCourier: { type: boolean }
      required: [userId, name, isCourier]

    CourierAgent:
      type: object
      properties:
        id: { type: integer }
        corporationId: { type: integer }
        userId: { type: ["integer", "null"] }
        name: { type: string }
        isActive: { type: boolean }
        routeCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, corporationId, userId, name, isActive, routeCount, createdAt, updatedAt]

    CourierAdminData:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CourierCandidate"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/CourierAgent"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/CourierRoute"
      required: [candidates, agents, routes]

    CourierProfile:
      type: object
      properties:
        isCourier: { type: boolean }
        agent:
          $ref: "#/components/schemas/CourierAgent"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/CourierRoute"
      required: [isCourier, routes]

    CreateCourierAgentBody:
      type: object
      properties:
        userId: { type: integer }
      required: [userId]

    UpdateCourierAgentBody:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        isActive: { type: boolean }
      required: [name, isActive]

    CreateCourierRouteBody:
      type: object
      properties:
        courierAgentId: { type: integer }
        origin: { type: string, minLength: 1, maxLength: 200 }
        destination: { type: string, minLength: 1, maxLength: 200 }
        pricingMethod:
          $ref: "#/components/schemas/CourierPricingMethod"
        baseFee: { type: number, minimum: 0 }
        pricePerM3: { type: number, minimum: 0 }
        collateralRate: { type: number, minimum: 0, maximum: 100 }
        isActive: { type: boolean }
      required: [courierAgentId, origin, destination, pricingMethod, baseFee, pricePerM3, collateralRate, isActive]

    UpdateCourierRouteBody:
      $ref: "#/components/schemas/CreateCourierRouteBody"

    CreateMyCourierRouteBody:
      type: object
      properties:
        origin: { type: string, minLength: 1, maxLength: 200 }
        destination: { type: string, minLength: 1, maxLength: 200 }
        pricingMethod:
          $ref: "#/components/schemas/CourierPricingMethod"
        baseFee: { type: number, minimum: 0 }
        pricePerM3: { type: number, minimum: 0 }
        collateralRate: { type: number, minimum: 0, maximum: 100 }
        isActive: { type: boolean }
      required: [origin, destination, pricingMethod, baseFee, pricePerM3, collateralRate, isActive]

    UpdateMyCourierRouteBody:
      $ref: "#/components/schemas/CreateMyCourierRouteBody"

    ReimbursementLoss:
      type: object
      properties:
        killmailId: { type: integer }
        killmailUrl: { type: string }
        lossOccurredAt: { type: string, format: date-time }
        shipTypeId: { type: integer }
        shipName: { type: string }
        lossValue: { type: number }
        alreadySubmitted: { type: boolean }
        claimId: { type: ["integer", "null"] }
        claimStatus:
          type: ["string", "null"]
          enum: [submitted, reviewing, approved, partially_approved, rejected, pending_payment, paid, null]
      required: [killmailId, killmailUrl, lossOccurredAt, shipTypeId, shipName, lossValue, alreadySubmitted, claimId, claimStatus]

    UpdateReimbursementBody:
      type: object
      properties:
        action:
          type: string
          enum: [start_review, approve, queue_payment, mark_paid, reject]
          description: Workflow action; the server calculates the next status
        status:
          type: string
          enum: [submitted, reviewing, approved, partially_approved, rejected, pending_payment, paid]
          deprecated: true
          description: Legacy compatibility field; mapped to a guarded workflow action and never trusted as the resulting status
        approvedAmount: { type: ["number", "null"] }
        reviewerNotes: { type: string }
        paymentReference: { type: string }

    EconomySource:
      type: object
      properties:
        source: { type: string }
        amount: { type: number }
      required: [source, amount]

    EconomyAction:
      type: object
      properties:
        category:
          type: string
          enum: [cost_control, existing_revenue, diversification, operations, data_quality]
        taxIndependent: { type: boolean }
        title: { type: string }
        evidence: { type: string }
        owner: { type: string }
        steps:
          type: array
          items: { type: string }
        startupCost: { type: number }
        timeToImpactDays: { type: integer }
        expectedMonthlyGain: { type: number }
        kpi: { type: string }
        risk: { type: string }
        confidence: { type: number }
      required: [title, evidence, owner, steps, startupCost, timeToImpactDays, expectedMonthlyGain, kpi, risk, confidence]

    EconomyAnalysis:
      type: object
      properties:
        source: { type: string, enum: [openai, rules] }
        model: { type: string }
        generatedAt: { type: string, format: date-time }
        summary: { type: string }
        actions:
          type: array
          items:
            $ref: "#/components/schemas/EconomyAction"
      required: [source, model, generatedAt, summary, actions]

    EconomySummary:
      type: object
      properties:
        connection:
          type: ["object", "null"]
          additionalProperties: true
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        walletBalance: { type: number }
        income: { type: number }
        expenses: { type: number }
        netGrowth: { type: number }
        previousNetGrowth: { type: number }
        reimbursementPaid: { type: number }
        reimbursementCount: { type: integer }
        entryCount: { type: integer }
        incomeSources:
          type: array
          items:
            $ref: "#/components/schemas/EconomySource"
        expenseSources:
          type: array
          items:
            $ref: "#/components/schemas/EconomySource"
        divisions:
          type: array
          items:
            type: object
            additionalProperties: true
        operationalPrograms:
          type: object
          properties:
            courier:
              type: object
              properties:
                enabled: { type: boolean }
                completedOrders: { type: integer }
                completedFees: { type: number }
                openOrders: { type: integer }
              required: [enabled, completedOrders, completedFees, openOrders]
          required: [courier]
        analysis:
          oneOf:
            - $ref: "#/components/schemas/EconomyAnalysis"
            - type: "null"
      required: [periodStart, periodEnd, walletBalance, income, expenses, netGrowth, previousNetGrowth, reimbursementPaid, reimbursementCount, entryCount, incomeSources, expenseSources, divisions]
